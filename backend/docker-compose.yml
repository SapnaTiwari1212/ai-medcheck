services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://aimedcheck:aimedcheck@postgres:5432/ai_medcheck
      REDIS_URL: redis://redis:6379
      REDIS_TLS: "false"
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-change-me-access-secret-at-least-32-chars}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change-me-refresh-secret-at-least-32-chars}
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OCR_PROVIDER: ${OCR_PROVIDER:-tesseract}
      STORAGE_PROVIDER: local
      LOCAL_STORAGE_PATH: /app/storage/uploads
      PUBLIC_STORAGE_BASE_URL: http://localhost:4000
      EMAIL_PROVIDER: console
      CLIENT_URL: ${CLIENT_URL:-http://localhost:5173}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - uploads:/app/storage/uploads

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["node", "dist/queues/worker.main.js"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://aimedcheck:aimedcheck@postgres:5432/ai_medcheck
      REDIS_URL: redis://redis:6379
      REDIS_TLS: "false"
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-change-me-access-secret-at-least-32-chars}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change-me-refresh-secret-at-least-32-chars}
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OCR_PROVIDER: ${OCR_PROVIDER:-tesseract}
      STORAGE_PROVIDER: local
      LOCAL_STORAGE_PATH: /app/storage/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - uploads:/app/storage/uploads

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: aimedcheck
      POSTGRES_PASSWORD: aimedcheck
      POSTGRES_DB: ai_medcheck
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aimedcheck -d ai_medcheck"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
  uploads:
