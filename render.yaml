services:
  - type: web
    name: ai-medcheck-api
    runtime: docker
    dockerfilePath: Dockerfile
    dockerContext: .
    envVars:
      - key: NODE_ENV
        value: development
      - key: PORT
        value: 4000
      - key: API_PREFIX
        value: api
      - key: DATABASE_URL
        fromDatabase:
          name: ai-medcheck-db
          property: connectionString
      - key: REDIS_URL
        sync: false
      - key: REDIS_TLS
        value: "false"
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 30d
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAME_SITE
        value: lax
      - key: CLIENT_URL
        sync: false
      - key: AI_PROVIDER
        value: mock
      - key: OCR_PROVIDER
        value: tesseract
      - key: STORAGE_PROVIDER
        value: local
      - key: LOCAL_STORAGE_PATH
        value: ./storage/uploads
      - key: PUBLIC_STORAGE_BASE_URL
        sync: false
      - key: EMAIL_PROVIDER
        value: console
      - key: THROTTLE_TTL
        value: "60"
      - key: THROTTLE_LIMIT
        value: "100"
      - key: QUEUE_CONCURRENCY
        value: "2"
      - key: QUEUE_ATTEMPTS
        value: "3"
      - key: QUEUE_BACKOFF
        value: "5000"
    healthCheckPath: /api/health
    autoDeploy: true

  - type: postgres
    name: ai-medcheck-db
    databaseName: ai_medcheck
    plan: free
